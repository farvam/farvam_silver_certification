<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARVAM | Fine Silver Certification</title>


<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    background:#f5f5f5;

    font-family:
    Tahoma,
    Arial,
    sans-serif;

    overflow-x:hidden;

}


/* ---------- فیلم شروع لوگو ---------- */


.intro-video{

    position:fixed;

    width:100%;

    height:100dvh;

    top:0;

    left:0;

    object-fit:contain;

    background:#000;

    z-index:100;

    animation:
    introHide 1.8s ease 5s forwards;

}



@keyframes introHide{

    from{

        opacity:1;

    }


    to{

        opacity:0;

        visibility:hidden;

    }

}



/* ---------- بخش محصول ---------- */


.product-section{


    min-height:100dvh;


    display:flex;


    justify-content:center;


    align-items:center;


    padding:25px;


}



.product-frame{


    width:88%;


    max-width:420px;


    background:
    linear-gradient(
    145deg,
    #ffffff,
    #eeeeee
    );


    border:

    2px solid

    #c7c7c7;


    border-radius:30px;


    padding:15px;


    box-shadow:

    0 15px 40px

    rgba(0,0,0,.15);


    opacity:0;


    animation:

    frameShow 1.5s ease 6s forwards;


}



@keyframes frameShow{


    from{

        opacity:0;

        transform:
        scale(.85)
        translateY(40px);

    }


    to{

        opacity:1;

        transform:
        scale(1)
        translateY(0);

    }


}



.product-video{


    width:100%;


    height:auto;


    max-height:70vh;


    object-fit:contain;


    border-radius:22px;


    display:block;


}



/* ---------- فضای ادامه صفحه ---------- */


.next-section{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-size:30px;

    color:#777;

}



</style>

</head>



<body>



<!-- فیلم اول لوگو -->

<video

class="intro-video"

autoplay

muted

playsinline>


<source

src="assets/intro.mp4"

type="video/mp4">


</video>




<!-- نمایش محصول -->


<section class="product-section">


<div class="product-frame">



<video

class="product-video"

autoplay

muted

loop

playsinline>


<source

src="assets/silver.mp4"

type="video/mp4">


</video>



</div>


</section>



<!-- بخش بعدی -->

<section class="next-section">


FARVAM


</section>




</body>

</html>
