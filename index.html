<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARVAM | Silver Certification</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050505;
    overflow-x:hidden;
}


/* فیلم شروع لوگو */

.intro{
    position:fixed;
    top:0;
    left:0;

    width:100%;
    height:100vh;

    object-fit:cover;

    z-index:100;

    animation: fadeOut 2s ease 6s forwards;
}


@keyframes fadeOut{

    from{
        opacity:1;
    }

    to{
        opacity:0;
        visibility:hidden;
    }

}


/* بخش بعد از فیلم */

.main{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

}


.box{

    width:80%;

    max-width:500px;

    height:400px;

    border:1px solid #c9a44c;

    border-radius:25px;

    display:flex;

    justify-content:center;

    align-items:center;

    color:#d5b35b;

    font-size:30px;

    opacity:0;

    animation:showBox 2s ease 7s forwards;

}


@keyframes showBox{

    from{

        opacity:0;

        transform:scale(.8);

    }

    to{

        opacity:1;

        transform:scale(1);

    }

}


</style>

</head>


<body>


<!-- فیلم لوگوی اولیه -->

<video 
class="intro"
autoplay
muted
playsinline>

<source src="assets/intro.mp4" type="video/mp4">

</video>



<!-- بخش اصلی -->

<div class="main">


<div class="box">

FARVAM
<br>
FINE SILVER

</div>


</div>


</body>

</html>
