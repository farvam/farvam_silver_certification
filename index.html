<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FARVAM | Fine Silver Certification</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

background:#050505;

font-family:
Tahoma,
Arial,
sans-serif;

overflow-x:hidden;

color:white;

}


/* فیلم شروع */

.intro-video{

position:fixed;

top:0;

left:0;

width:100%;

height:100dvh;

object-fit:contain;

background:#000;

z-index:100;

animation:
introHide 2s ease 5s forwards;

}


@keyframes introHide{

from{

opacity:1;

}

to{

opacity:0;

visibility:hidden;

}

}



/* بخش محصول */

.product-section{


min-height:100dvh;


display:flex;


justify-content:center;


align-items:center;


padding:25px;


background:

radial-gradient(

circle at center,

#1c1608,

#050505 65%

);


}



/* قاب لوکس */


.product-frame{


width:88%;


max-width:420px;


padding:15px;


border-radius:30px;


background:

linear-gradient(

145deg,

#151515,

#050505

);



border:

2px solid

#d4af37;



box-shadow:


0 0 35px

rgba(212,175,55,.35),


inset 0 0 20px

rgba(255,255,255,.05);



opacity:0;


animation:

frameShow 1.5s ease 6s forwards;


}



@keyframes frameShow{


from{


opacity:0;


transform:

scale(.8)

translateY(50px);


}


to{


opacity:1;


transform:

scale(1)

translateY(0);


}


}



/* فیلم نقره */


.product-video{


width:100%;


display:block;


border-radius:22px;


object-fit:contain;


max-height:70vh;


}



/* بخش بعدی */


.next-section{


height:100vh;


display:flex;


justify-content:center;


align-items:center;


font-size:35px;


color:#d4af37;


background:#050505;


}



</style>


</head>



<body>



<!-- فیلم لوگو -->


<video

class="intro-video"

autoplay

muted

playsinline>


<source

src="assets/intro.mp4"

type="video/mp4">


</video>




<!-- قاب محصول -->


<section class="product-section">


<div class="product-frame">



<video

class="product-video"

autoplay

muted

loop

playsinline>


<source

src="assets/silver.mp4"

type="video/mp4">


</video>



</div>


</section>




<section class="next-section">


⚜️ FARVAM ⚜️


</section>




</body>

</html>
