<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
FARVAM Admin Panel
</title>

<link rel="stylesheet" href="admin.css">

</head>


<body>


<!-- ورود -->

<div id="loginBox">


<h2>
⚜️ ورود مدیریت FARVAM
</h2>


<input id="adminUser" placeholder="نام کاربری">


<input 
id="adminPass"
type="password"
placeholder="رمز عبور">


<button id="loginBtn">
ورود
</button>


<p id="loginMessage"></p>


</div>





<!-- پنل -->

<div id="adminPanel">


<div class="container">


<h1>
⚜️ FARVAM ADMIN
</h1>


<h2>
مدیریت محصولات
</h2>



<div class="box">


<input id="serial" placeholder="شماره سریال">


<input id="name" placeholder="نام محصول">


<input id="purity" placeholder="عیار">


<input id="weight" placeholder="وزن">



<button id="addProduct">
ثبت محصول
</button>


</div>




<div class="products">


<h2>
لیست محصولات
</h2>


<div id="list">

درحال بارگذاری...

</div>


</div>


</div>


</div>




<script src="admin.js"></script>


</body>

</html>
