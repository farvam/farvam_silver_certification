<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
FARVAM ADMIN
</title>


<link rel="stylesheet" href="admin.css">


</head>


<body>


<div id="loginBox">


<h1>
⚜️ FARVAM
</h1>


<h2>
ورود مدیریت
</h2>


<input id="adminUser" placeholder="نام کاربری">


<input 
id="adminPass"
type="password"
placeholder="رمز عبور">


<button id="loginBtn">
ورود
</button>


<p id="loginMessage"></p>


</div>





<div id="adminPanel">


<div class="container">


<h1>
⚜️ FARVAM ADMIN PANEL
</h1>



<div class="box">


<h2>
افزودن محصول
</h2>



<input id="serial" placeholder="شماره سریال">


<input id="name" placeholder="نام محصول">


<input id="purity" placeholder="عیار">


<input id="weight" placeholder="وزن">


<select id="mediaType">

<option value="video">
فیلم
</option>

<option value="image">
عکس
</option>

</select>


<input id="mediaSrc" placeholder="مسیر فایل">


<textarea 
id="description"
placeholder="متن گواهی محصول">
</textarea>



<button id="addProduct">

ثبت محصول

</button>


</div>






<div class="products">


<h2>
محصولات ثبت شده
</h2>


<div id="list">

درحال بارگذاری...

</div>


</div>


</div>


</div>




<script src="config.js"></script>

<script src="admin.js"></script>


</body>

</html>
